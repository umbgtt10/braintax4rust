# End-to-end validation of braintax4rust against the fixture crates.
#
# The ordinal ranking test drives the analyser over every fixture in turn and
# asserts that their braintax scores stay in one fixed order. Its subject is the
# scoring model as a whole rather than any one source file, so it never had a
# mirror in core/ to be named after -- which is what paired-test-file kept
# reporting while it lived there.
#
# A workspace member rather than an excluded crate, so `cargo test` at the root
# still runs it. Stage 2 passes --package cargo-braintax4rust to each gate, so
# the house rules measure core/ and leave this alone.
[package]
name = "validation"
version = "0.12.0"
edition = "2024"
description = "End-to-end validation of braintax4rust against the fixture crates"
license = "MIT"
publish = false

autotests = false

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"

[dev-dependencies]
braintax.workspace = true
braintax-test-utils.workspace = true
serde_json.workspace = true
