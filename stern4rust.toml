# House coding rules, enforced by `cargo stern4rust` first in stage 2.
#
# The header rule is the one rule that cannot hold until it is told what the
# header says. Naming the file here rather than in the gate script means a
# hand-run of `cargo stern4rust` checks exactly what the gate checks.
header-file = "docs/header.txt"

# `validation` has no `src/` at all: it runs the built binary against the
# fixture crates and asserts on the JSON that comes back, so its tests are
# named for what they check rather than for a source file.
# `paired-test-file` asks every `<x>_tests.rs` to name an `src/<x>.rs`, and
# there is no `src/` here for one to be named after -- the rule has nothing to
# match rather than something it dislikes.
[package.validation]
skip = ["paired-test-file"]

# The fixture crates are analysis input, not code this workspace ships. Each is
# a deliberately-shaped package that braintax is pointed at, carrying one test
# that asserts on the numbers which come back -- so the shape of a fixture is
# the thing under test, and correcting it is changing the question.
#
# They stay workspace members rather than being excluded, because those tests
# are braintax's acceptance suite and stage 1's `cargo test` has to keep running
# them. Membership is what draws them into a bare `cargo stern4rust`, so the
# stand-down is written here instead of in the manifest.
#
# Four rules cannot hold in any fixture:
#
#   paired-test-file     `analysis_tests.rs` names no `src/analysis.rs`; like
#                        `validation`, it is named for what it checks
#   tests-layout         one acceptance test per fixture, so no all_tests.rs
#   test-file-structure  import order and spacing inside that one test file
#   imported-paths       the test reaches into braintax's own modules
#
# and four fixtures break `single-implemented-type`, one breaks
# `tested-public-api` and one breaks `module-registry` -- by construction. A
# second implemented type in one file, an undocumented public item and a
# macro-built module are the shapes those fixtures exist to measure.
#
# Nothing is skipped anywhere else.
[package.fixture-base_assoc_only]
skip = ["imported-paths", "paired-test-file", "test-file-structure", "tests-layout"]

[package.fixture-base_cfg]
skip = ["imported-paths", "paired-test-file", "test-file-structure", "tests-layout"]

[package.fixture-base_depth1]
skip = [
    "imported-paths",
    "paired-test-file",
    "test-file-structure",
    "tested-public-api",
    "tests-layout",
]

