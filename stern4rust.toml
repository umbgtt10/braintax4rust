# House coding rules, enforced by `cargo stern4rust` first in stage 2.
#
# All twenty-two rules apply to every member of the workspace: nothing is
# skipped and nothing is selected. A hand-run of a bare `cargo stern4rust`
# judges every package; the stage 2 gate narrows that to cargo-braintax4rust and
# xtask with --package, and checks them exactly as this file says.
#
# The header rule is the one rule that cannot hold until it is told what the
# header says. Naming the file here rather than in the gate script means a
# hand-run of `cargo stern4rust` checks exactly what the gate checks.
header-file = "docs/header.txt"

# The fixture crates are analysis input. Each `src/` is a deliberately shaped
# package that braintax is pointed at, and its acceptance test asserts on the
# numbers that come back -- so the shape of a fixture's source is the thing
# under test, and correcting it is changing the question. The validation crate's
# ordinal ranking pins the same sources to one fixed order of scores.
#
# The files below break a house rule by construction, and are kept out of the
# scan rather than having the rule stood down: an exclusion names one file and
# is counted in the report, where a skip silenced the rule for the whole package
# -- tests included. Everything else in every fixture, its `src/` and its
# acceptance test alike, is held to all twenty-two rules.
#
# braintax reads no file under `tests/`, so the acceptance tests themselves are
# not analysis input and are not excluded: they follow the house layout like any
# other suite.

# `compute` is public, one module below the crate root -- the depth the fixture
# measures. Nothing calls it: the acceptance test analyses the source rather
# than running it, so tested-public-api has no call to find.
[package.fixture-base_depth1]
exclude = ["src/deep/compute.rs"]

# `std::ptr::null()` is spelled as a path inside the `unsafe` block whose
# hidden dependencies the fixture exists to weigh (imported-paths).
[package.fixture-base_hidden_deps]
exclude = ["src/risky.rs"]

# The known standard trait is written `impl std::fmt::Debug`, with
# `std::fmt::Formatter` and `std::fmt::Result` in its signature. The signature
# scorer walks those path segments, so importing them would move the score
# (imported-paths).
[package.fixture-base_known_trait]
exclude = ["src/compute.rs"]

# A `#[macro_export]` macro beside the module declarations is the macro-built
# shape the fixture measures (module-registry). With lib.rs out of the scan,
# this fixture's acceptance test is named for src/compute.rs, where the macro is
# used, rather than for lib.rs like every other fixture's.
[package.fixture-base_macros]
exclude = ["src/lib.rs"]

# Several types implementing one trait, in one file, is what these four
# fixtures exist to measure: the trait factor's dispatch penalty rises with the
# number of implementations a reader has to tell apart at a call site
# (single-implemented-type).
[package.fixture-base_trait_assoc_dispatch]
exclude = ["src/compute.rs"]

[package.fixture-base_trait_four_impls]
exclude = ["src/compute.rs"]

[package.fixture-base_trait_multi]
exclude = ["src/compute.rs"]

[package.fixture-base_trait_two_impls]
exclude = ["src/compute.rs"]
