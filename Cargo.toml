[workspace]
members = [
    "core",
    "validation",
    "test-utils",
    "fixture/base_flat",
    "fixture/base_depth1",
    "fixture/base_cfg",
    "fixture/base_trait",
    "fixture/base_opaque",
    "fixture/base_macros",
    "fixture/base_generics",
    "fixture/base_hidden_deps",
    "fixture/base_trait_refined",
    "fixture/base_trait_multi",
    "fixture/base_trait_two_impls",
    "fixture/base_trait_four_impls",
    "fixture/base_trait_assoc_dispatch",
    "fixture/base_assoc_only",
    "fixture/base_super_only",
    "fixture/base_many_methods",
    "fixture/base_inherent",
    "fixture/base_known_trait",
]
resolver = "2"

[workspace.dependencies]
braintax = { path = "core", package = "cargo-braintax4rust" }
braintax-test-utils = { path = "test-utils" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
walkdir = "2"
tempfile = "3"
