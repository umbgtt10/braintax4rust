[workspace]
members = [
    "core",
    "cli",
    "validation",
    "xtask",
    "fixture/base_flat",
    "fixture/base_depth1",
    "fixture/base_cfg",
    "fixture/base_trait",
    "fixture/base_opaque",
    "fixture/base_macros",
    "fixture/base_generics",
    "fixture/base_hidden_deps",
    "fixture/base_trait_refined",
    "fixture/base_trait_multi",
    "fixture/base_trait_two_impls",
    "fixture/base_trait_four_impls",
    "fixture/base_trait_assoc_dispatch",
    "fixture/base_assoc_only",
    "fixture/base_super_only",
    "fixture/base_many_methods",
    "fixture/base_inherent",
    "fixture/base_known_trait",
]
resolver = "2"

# The two published crates release together.
[workspace.package]
version = "0.16.0"
edition = "2024"
authors = ["Umberto Gotti <umberto.gotti@umbertogotti.dev>"]
license = "MIT"
repository = "https://github.com/umbgtt10/braintax4rust"

[workspace.dependencies]
braintax = { path = "core", package = "braintax4rust-core", version = "0.16.0" }
braintax-cli = { path = "cli", package = "cargo-braintax4rust" }

clap = { version = "4", features = ["derive"] }
libm = "0.2.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serge4rust = "0.3.3"
syn = { version = "3.0.10", features = ["full", "visit"] }
walkdir = "2"
tempfile = "3"

# No `unsafe` in the tool's own crates, tests included; core says so at its
# crate root as well. The fixtures do not opt in, each with an empty `[lints]`
# table: base_hidden_deps weighs an `unsafe` block by construction.
[workspace.lints.rust]
unsafe_code = "forbid"

# The gates cargo-ripe4rust holds each step of its plan to: both stages, as
# every change here is held to them. `published` names the crate others depend
# on as a library, so a breaking dependency in its public API is asked about;
# cargo-braintax4rust's library is the command's, kept for its tests.
[workspace.metadata.ripe4rust]
gates = ["just stage1", "just stage2"]
published = ["braintax4rust-core"]
