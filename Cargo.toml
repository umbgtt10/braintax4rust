[workspace]
members = [
    "core",
    "cli",
    "validation",
    "xtask",
    "fixture/base_flat",
    "fixture/base_depth1",
    "fixture/base_cfg",
    "fixture/base_trait",
    "fixture/base_opaque",
    "fixture/base_macros",
    "fixture/base_generics",
    "fixture/base_hidden_deps",
    "fixture/base_trait_refined",
    "fixture/base_trait_multi",
    "fixture/base_trait_two_impls",
    "fixture/base_trait_four_impls",
    "fixture/base_trait_assoc_dispatch",
    "fixture/base_assoc_only",
    "fixture/base_super_only",
    "fixture/base_many_methods",
    "fixture/base_inherent",
    "fixture/base_known_trait",
]
resolver = "2"

# The two published crates release together.
[workspace.package]
version = "0.13.1"
edition = "2024"
authors = ["Umberto Gotti <umberto.gotti@umbertogotti.dev>"]
license = "MIT"
repository = "https://github.com/umbgtt10/braintax4rust"

[workspace.dependencies]
braintax = { path = "core", package = "braintax4rust-core", version = "0.13.1" }
braintax-cli = { path = "cli", package = "cargo-braintax4rust" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
walkdir = "2"
tempfile = "3"

# No `unsafe` in the tool's own crates, tests included; core says so at its
# crate root as well. The fixtures do not opt in: base_hidden_deps weighs an
# `unsafe` block by construction.
[workspace.lints.rust]
unsafe_code = "forbid"
